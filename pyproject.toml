# 工具配置。
# 运行时依赖的唯一来源是 requirements.txt（此处不重复声明，避免双份真值）。
# 完整可复现版本见 requirements.lock.txt。

[project]
name = "life-assistant"
version = "0.9.1"
description = "AI 驱动的 PySide6 桌面日程管理应用"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "build", "dist", "data"]

[tool.ruff.lint]
# 显式固定规则集：防止 ruff 升级后默认集变化导致"基线"漂移（见 PLAN E 遗留问题）。
# 只选对本项目有意义的族，避免噪声规则淹没真实问题。
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "SIM", "RUF", "S", "T20",
          # 返回类型注解（存量已补齐；参数注解 ANN001 暂不强制，见 CODE_STANDARDS Q-A6）
          "ANN201", "ANN202", "ANN204", "ANN002", "ANN003"]
ignore = [
  "E501",                         # 行长由 formatter 决定
  "RUF001", "RUF002", "RUF003",   # 中文全角标点属正常书写，非"歧义字符"
  "S101",                         # assert 在本项目用于内部不变量
  "SIM105",                       # 用 contextlib.suppress 替换 try/except-pass，改动面大，暂缓
]

[tool.ruff.lint.per-file-ignores]
# scripts/* 的 print 是 CLI 输出契约（被 run_in_process 捕获），不算调试残留
"scripts/*" = ["T20"]

# ⚠ UI 层**不再整目录豁免** BLE001（2026-10-17 审查：范围过大 —— 那会把业务代码里的
# 盲捕获一起放过）。Qt 事件边界（槽函数 / 刷新包装）确实必须吞异常，改为**逐处**
# `# noqa: BLE001` + 理由；新增的盲捕获会被 ruff 拦下。
