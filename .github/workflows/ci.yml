name: CI

# 2026-10-20：代码仓库已**公开** → Actions 免费不限量 ✓ → push/PR **自动跑**恢复。
# （在此之前为了省私有仓库额度，曾改成只手动触发；数据相关的每日摘要已搬到私有数据仓库。）
# 本地等价物：`.venv\Scripts\python.exe scripts/ci_local.py`
#
# 2026-11-21 审计：原 push 过滤只留 master，而日常开发在 `dev` ——
# "交付分支"根本没被覆盖，push 上去的门禁结论是别的分支的。现在覆盖两个分支。

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

# ⚠ 整个 workflow 都要 UTF-8：测试里会**起子进程**（`main.py` / `git`）打印中文，
#   不带这个的话 Windows runner 的默认编码是 charmap → `UnicodeEncodeError` ✗
#   （2026-10-20 我重写 ci.yml 时漏了这行，CI 立刻红了两条）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  check:
    # 与目标平台一致（PySide6 的 Qt 库在 Windows runner 上开箱可用）
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 装依赖
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements-dev.txt
      - name: 项目门禁
        run: ./.venv/Scripts/python.exe scripts/ci_local.py --keep-going

  lock-repro:
    # 锁文件复现：只照 requirements.lock.txt 装一遍，验证"照着锁能装出可用环境"。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 按锁文件安装
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements.lock.txt
      - name: 依赖一致性
        run: ./.venv/Scripts/python.exe -m pip check
      - name: 锁环境合成验收
        run: ./.venv/Scripts/python.exe scripts/acceptance_check.py
