name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # 与目标平台一致（PySide6 的 Qt 库在 Windows runner 上开箱可用）
    runs-on: windows-latest
    env:
      # Windows runner 控制台默认 cp1252，中文输出会 UnicodeEncodeError
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall -q src scripts plugins

      - name: 静态检查（ruff）
        run: python -m ruff check src scripts plugins tests

      - name: UI 令牌合规
        run: python scripts/check_ui_tokens.py --strict

      # 规范里"能自动检查"的部分（尺寸/静默吞异常/ID 生成/令牌命名/i18n 计数/
      # 顶层目录/密钥入库 + vulture + radon）；存量债走 scripts/quality_baseline.json
      - name: 工程规范门禁
        run: python scripts/check_quality.py --strict

      # 覆盖率下限防"越改越少测"（当前约 54%，留出余量取 50）
      - name: 测试 + 覆盖率下限
        run: python -m pytest -q --cov=src --cov=scripts --cov-fail-under=50
