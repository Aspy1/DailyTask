name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # 与目标平台一致（PySide6 的 Qt 库在 Windows runner 上开箱可用）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: python -m ruff check src scripts plugins tests

      - name: UI 令牌合规
        run: python scripts/check_ui_tokens.py --strict

      - name: 测试
        run: python -m pytest -q
