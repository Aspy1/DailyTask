name: CI（手动触发）

# ⚠ 2026-10-20 起**不再随 push 自动跑**：仓库是私有的，Actions 按分钟计费
#   （Free 2,000 分钟/月，Windows ×2）；原来每次 push 跑 4 个 job ≈ 17 分钟 ✗。
#   额度要留给 `daily-digest.yml`（每天 4:55 的日程摘要）。
#   日常验证请用本地：`.venv\Scripts\python.exe scripts/ci_local.py`
#   需要看"干净环境 / 3.12 兼容"时，到 Actions 页面手动点 Run workflow。

on:
  workflow_dispatch:

jobs:
  check:
    # 与目标平台一致（PySide6 的 Qt 库在 Windows runner 上开箱可用）
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 编译检查
        run: python -m compileall -q src scripts tests
      - name: ruff
        run: python -m ruff check src scripts tests
      - name: UI 令牌门禁
        run: python scripts/check_ui_tokens.py --strict --check-px
      - name: 工程规范门禁
        run: python scripts/check_quality.py --strict
      - name: 测试
        run: python -m pytest -q

  lock-repro:
    # 锁文件复现：只照 requirements.lock.txt 装一遍，验证"照着锁能装出可用环境"。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 按锁文件安装
        run: python -m pip install -r requirements.lock.txt
      - name: 依赖一致性
        run: python -m pip check
